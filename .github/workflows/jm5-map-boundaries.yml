name: JM5 map examples
on:
  push:
    paths:
      - "JM5-*/**"
      - "J2-0[56]-jm5-maps-supplemental-*/**"
      - ".github/workflows/jm5-map-boundaries.yml"
      - "tools/verify-jm5-map-examples.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ./verify-course-source.sh
      - run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-jm5-map-examples.py
