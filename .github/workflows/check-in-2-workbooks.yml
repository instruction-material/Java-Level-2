name: Java Level 2 clock check-in workbooks
on:
  push:
    paths:
      - "JM-Check-in-2-*/**"
      - "J2-*-check-in-2-supplemental-*/**"
      - ".github/workflows/check-in-2-workbooks.yml"
      - "tools/verify-check-in-2-workbooks.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ./verify-course-source.sh
      - run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-check-in-2-workbooks.py
