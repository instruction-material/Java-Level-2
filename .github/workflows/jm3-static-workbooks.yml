name: JM3 static and ordering examples
on:
  push:
    paths:
      - "JM3-*/**"
      - "J2-01-jm3-static-variables-and-methods-supplemental-3/**"
      - ".github/workflows/jm3-static-workbooks.yml"
      - "tools/verify-jm3-workbooks.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ./verify-course-source.sh
      - run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-jm3-workbooks.py
