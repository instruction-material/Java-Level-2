name: Java Level 2 maze reader and runner
on:
  push:
    paths:
      - "Maze-Runner-Part-2/**"
      - "Maze-Reader/**"
      - ".github/workflows/maze-originals.yml"
      - "tools/verify-maze-originals.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ./verify-course-source.sh
      - run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-maze-originals.py
