name: JM4 inheritance workbooks
on:
  push:
    paths:
      - "JM4-*/**"
      - "J2-04-jm4-subclasses-and-inheritance-supplemental-3/**"
      - ".github/workflows/jm4-inheritance-workbooks.yml"
      - "tools/verify-jm4-workbooks.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ./verify-course-source.sh
      - run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-jm4-workbooks.py
