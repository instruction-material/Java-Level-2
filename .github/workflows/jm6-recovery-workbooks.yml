name: JM6 exception and concurrency workbooks
on:
  push:
    paths:
      - "JM6-*/**"
      - "J2-0[78]-jm6-threading-and-error-handling-supplemental-*/**"
      - ".github/workflows/jm6-recovery-workbooks.yml"
      - "tools/verify-jm6-workbooks.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ./verify-course-source.sh
      - run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-jm6-workbooks.py
