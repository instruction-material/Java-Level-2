name: Java Level 2 reference examples
on:
  push:
    paths:
      - "JM-Java-File-IO/**"
      - "JM-stdinstdout/**"
      - "JM6-Try-Catch-Example/**"
      - "tools/verify-reference-examples.py"
      - ".github/workflows/reference-examples.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ./verify-course-source.sh
      - run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-reference-examples.py
