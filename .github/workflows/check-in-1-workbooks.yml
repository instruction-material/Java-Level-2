name: Check-In 1 workbooks
on:
  push:
    paths:
      - "JM-Check-in-1*/**"
      - "J2-0[23]-check-in-1-supplemental-*/**"
      - ".github/workflows/check-in-1-workbooks.yml"
      - "tools/verify-check-in-1-workbooks.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ./verify-course-source.sh
      - run: JAVA_HOME="$JAVA_HOME_21_X64" python3 tools/verify-check-in-1-workbooks.py
